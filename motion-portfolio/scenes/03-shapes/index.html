<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>03 — Brand Motion</title>
<link rel="stylesheet" href="../../engine/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-scene="03-shapes">
<div id="stage">
  <div id="bg" class="full"></div>
  <div id="cam" class="full">
    <svg id="svg" width="1920" height="1080" viewBox="0 0 1920 1080">
      <defs>
        <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
          <circle cx="20" cy="20" r="1.6" fill="#ddd3c0" />
        </pattern>
      </defs>
      <rect id="dotgrid" x="0" y="0" width="1920" height="1080" fill="url(#dots)" />
      <g id="shadows"></g>
      <!-- 1 · rebond -->
      <g id="s1" class="sec">
        <line id="ground" x1="960" y1="0" x2="960" y2="0" />
        <g id="ball"><g id="ballS"><circle r="72" cy="-72" class="red" /></g></g>
      </g>
      <!-- 2 · le trio -->
      <g id="s2" class="sec">
        <g id="tA"><g class="sq"><path id="pA" class="red" /></g></g>
        <g id="tB"><g class="sq"><path id="pB" class="blue" /></g></g>
        <g id="tC"><g class="sq"><path id="pC" class="yellow" /></g></g>
      </g>
      <!-- 3 · grille de motifs -->
      <g id="s3" class="sec"><g id="grid"></g></g>
      <!-- 4 · ligne & trajectoire -->
      <g id="s4" class="sec">
        <path id="loop" fill="none" />
        <circle id="rider" r="20" class="yellow" />
        <g id="rings"></g>
      </g>
      <!-- 5 · pendule de Newton -->
      <g id="s5" class="sec">
        <rect id="beam" x="560" y="250" width="800" height="16" rx="8" class="ink" />
        <g id="cradle"></g>
      </g>
      <!-- 6 · orbites -->
      <g id="s6" class="sec">
        <g id="orbits"></g>
        <g id="planets"></g>
        <circle id="sun" cx="960" cy="540" r="90" class="red" />
      </g>
      <!-- 7-8 · logo -->
      <g id="s7" class="sec">
        <g id="mark">
          <g id="mSq"><g class="sq"><rect x="-90" y="-180" width="180" height="180" rx="10" class="blue" /></g></g>
          <g id="mCi"><g class="sq"><circle cx="0" cy="-90" r="90" class="red" /></g></g>
          <g id="mTr"><g class="sq"><path d="M0,-186 L104,0 L-104,0 Z" class="yellow" stroke-linejoin="round" /></g></g>
        </g>
      </g>
    </svg>
    <div id="word"></div>
    <div id="tagline"></div>
  </div>
  <div id="iris" class="full"></div>
  <div id="endcard">
    <div id="ecName"></div>
    <div id="ecRole"></div>
  </div>
</div>
<script src="../../node_modules/gsap/dist/gsap.min.js"></script>
<script src="../../node_modules/gsap/dist/MorphSVGPlugin.min.js"></script>
<script src="../../node_modules/gsap/dist/DrawSVGPlugin.min.js"></script>
<script src="../../node_modules/gsap/dist/MotionPathPlugin.min.js"></script>
<script src="../../engine/runtime.js"></script>
<script src="../../config.js"></script>
<script src="scene.js"></script>
</body>
</html>
