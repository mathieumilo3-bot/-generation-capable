# Netlify config for generation-capable-vitrine.
# The Netlify project is currently building from the repository root, so paths
# are explicit instead of relying on a project-side base-directory setting.
[build]
  command = "npm --prefix site-vitrine run build"
  publish = "site-vitrine/.next"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
