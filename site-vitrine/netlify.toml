# Configuration propre à ce sous-dossier : le netlify.toml de la racine
# concerne l'ancien produit (fonctions, redirections, programme ambassadeurs)
# et ne doit pas s'appliquer ici. Le projet Netlify de ce site doit avoir
# « site-vitrine » comme répertoire de base.
[build]
  command = "npm run build"
  publish = ".next"
  # Monorepo : ne reconstruire GC Agence que si son propre dossier change.
  # Compatible que Netlify exécute cette commande depuis la racine du dépôt
  # ou depuis site-vitrine comme base directory.
  ignore = "if [ -d site-vitrine ]; then git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site-vitrine; else git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- .; fi"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Les en-têtes de sécurité sont définis dans next.config.ts pour rester
# identiques en local, en preview et en production.
