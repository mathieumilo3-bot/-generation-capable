# Configuration propre à ce sous-dossier : le netlify.toml de la racine
# concerne l'ancien produit (fonctions, redirections, programme ambassadeurs)
# et ne doit pas s'appliquer ici. Le projet Netlify de ce site doit avoir
# « site-vitrine » comme répertoire de base.
[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Les en-têtes de sécurité sont définis dans next.config.ts pour rester
# identiques en local, en preview et en production.
