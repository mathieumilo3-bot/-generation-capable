<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CIELO OS — Control Center</title>
    <meta
      name="description"
      content="CIELO OS — the operating system behind every Cielo experience. Interactive concept prototype built on demonstration data."
    />
    <!-- Prototype client : jamais indexé. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" href="data:," />

    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
  </head>

  <body>
    <div class="ambient" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div id="boot"></div>
    <div id="app" class="app"></div>
    <div id="overlay" class="overlay-root"></div>

    <noscript>
      <div style="padding: 48px; max-width: 60ch; margin: 0 auto">
        <h1 style="font-weight: 300; letter-spacing: -0.03em">CIELO OS</h1>
        <p style="color: #b7b7b7">
          This prototype is an interactive interface and requires JavaScript.
        </p>
      </div>
    </noscript>

    <!--
      Chargement en scripts classiques (pas de modules ES) : le prototype doit
      s'ouvrir aussi bien depuis un serveur que par double-clic sur le fichier,
      sans build ni connexion réseau.
      L'ordre compte : données → primitives → graphiques → blocs → vues → shell.
    -->
    <script src="app/data.js"></script>
    <script src="app/ui.js"></script>
    <script src="app/charts.js"></script>
    <script src="app/blocks.js"></script>
    <script src="app/overlays.js"></script>
    <script src="app/views/overview.js"></script>
    <script src="app/views/events.js"></script>
    <script src="app/views/audience.js"></script>
    <script src="app/views/access.js"></script>
    <script src="app/views/referrals.js"></script>
    <script src="app/views/partners.js"></script>
    <script src="app/views/analytics.js"></script>
    <script src="app/views/loop.js"></script>
    <script src="app/app.js"></script>
  </body>
</html>
