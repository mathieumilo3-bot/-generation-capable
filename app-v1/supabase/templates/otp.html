<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"></head>
<body style="margin:0;background:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<div style="max-width:520px;margin:0 auto;padding:40px 24px">
<h1 style="margin:0 0 16px;font-size:28px;line-height:34px;color:#1D1D1F">Votre code de connexion</h1>
<p style="margin:0 0 24px;font-size:17px;line-height:24px;color:#1D1D1F">Saisissez ce code dans l'application pour vous connecter :</p>
<p style="margin:0 0 24px;font-size:40px;letter-spacing:8px;font-weight:700;color:#1D1D1F">{{ .Token }}</p>
<p style="margin:0;font-size:15px;line-height:21px;color:#6E6E73">Ce code expire dans 10 minutes. Si vous n'êtes pas à l'origine de cette demande, ignorez simplement ce message.</p>
</div></body></html>
