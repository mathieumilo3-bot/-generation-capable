name: Inspect Netlify MCP zipAndBuild

on:
  push:
    branches:
      - "prixchantier/netlify-deploy-20260926"
    paths:
      - ".github/workflows/prixchantier-netlify-debug.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect implementation
        run: |
          npm pack @netlify/mcp@latest >/tmp/pkg.txt
          PKG=$(tail -1 /tmp/pkg.txt)
          mkdir pkg
          tar -xzf "$PKG" -C pkg
          LINE=$(grep -n "zipAndBuild" pkg/package/dist/netlify-mcp.js | head -1 | cut -d: -f1)
          START=$((LINE-140))
          END=$((LINE+180))
          sed -n "${START},${END}p" pkg/package/dist/netlify-mcp.js
