name: Read current PrixChantier diagnostic

on:
  push:
    branches:
      - "prixchantier/netlify-deploy-20260926"
    paths:
      - ".github/workflows/prixchantier-netlify-debug.yml"

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read exit
        run: |
          echo "=== exit.txt ==="
          curl -i -sS https://prixchantier.netlify.app/exit.txt || true
      - name: Read build log
        run: |
          echo "=== build.log ==="
          curl -i -sS https://prixchantier.netlify.app/build.log || true
