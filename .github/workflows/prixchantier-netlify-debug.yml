name: Smoke PrixChantier production

on:
  push:
    branches:
      - "prixchantier/netlify-deploy-20260926"
    paths:
      - ".github/workflows/prixchantier-netlify-debug.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check public routes
        run: |
          for p in / /login /signup /forgot-password /api/cron/tick; do
            echo "=== $p ==="
            curl -sS -o /tmp/body -D /tmp/headers -w "HTTP=%{http_code}\n" "https://prixchantier.netlify.app$p" || true
            head -20 /tmp/headers
            head -c 500 /tmp/body || true
            echo
          done
