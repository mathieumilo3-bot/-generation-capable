name: Inspect Netlify MCP CLI

on:
  push:
    branches:
      - "prixchantier/netlify-deploy-20260926"
    paths:
      - ".github/workflows/prixchantier-netlify-debug.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect package
        run: |
          npm pack @netlify/mcp@latest >/tmp/pkg.txt
          PKG=$(tail -1 /tmp/pkg.txt)
          mkdir pkg
          tar -xzf "$PKG" -C pkg
          echo "=== proxy-path references ==="
          grep -Rni --exclude='*.map' "proxy-path\|proxyPath\|site-id\|no-wait" pkg/package | head -120 || true
          echo "=== argv/options ==="
          grep -Rni --exclude='*.map' "process.argv\|parseArgs\|commander\|yargs\|option(" pkg/package | head -160 || true
