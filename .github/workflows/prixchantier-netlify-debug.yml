name: Package PrixChantier Netlify output

on:
  push:
    branches:
      - "prixchantier/netlify-deploy-20260926"
    paths:
      - ".github/workflows/prixchantier-netlify-debug.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: prixchantier
        run: npm ci
      - name: Build Netlify output
        working-directory: prixchantier
        run: |
          mkdir -p .netlify
          printf '{"siteId":"043f9a8f-7a88-4f95-b3c8-85b8c5606799"}' > .netlify/state.json
          cp netlify.toml /tmp/netlify.outer.toml
          printf '[build]\ncommand = "npm run build"\n\n[[plugins]]\npackage = "@netlify/plugin-nextjs"\n' > netlify.toml
          npx -y netlify-cli@latest build --offline
          mv /tmp/netlify.outer.toml netlify.toml
          echo "=== directories ==="
          find .netlify -maxdepth 3 -type d | sort | head -120
          echo "=== files ==="
          find .netlify -maxdepth 3 -type f | sort | head -180
      - uses: actions/upload-artifact@v4
        with:
          name: prixchantier-netlify-output
          path: prixchantier/.netlify
          include-hidden-files: true
          retention-days: 1
