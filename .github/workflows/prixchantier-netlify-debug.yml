name: Validate PrixChantier nested Netlify build v2

on:
  push:
    branches:
      - "prixchantier/netlify-deploy-20260926"
    paths:
      - ".github/workflows/prixchantier-netlify-debug.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: prixchantier
        run: npm ci
      - name: Validate full Netlify build
        working-directory: prixchantier
        run: |
          mkdir -p .netlify
          printf '{"siteId":"043f9a8f-7a88-4f95-b3c8-85b8c5606799"}' > .netlify/state.json
          npx -y netlify-cli@latest build --offline
          echo "FUNCTIONS"
          find .netlify/functions -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo "EDGE"
          find .netlify/edge-functions-dist -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          echo "STATIC"
          du -sh .netlify/static
