name: Read Netlify remote Next build log

on:
  push:
    branches:
      - "prixchantier/netlify-deploy-20260926"
    paths:
      - ".github/workflows/prixchantier-netlify-debug.yml"

permissions:
  contents: read

jobs:
  readlog:
    runs-on: ubuntu-latest
    steps:
      - name: Read exit code
        run: curl -fsSL https://prixchantier.netlify.app/exit.txt || true
      - name: Read build log
        run: curl -fsSL https://prixchantier.netlify.app/build.log || true
