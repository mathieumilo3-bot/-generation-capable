name: Inspect Netlify MCP deploy code

on:
  push:
    branches:
      - "prixchantier/netlify-deploy-20260926"
    paths:
      - ".github/workflows/prixchantier-netlify-debug.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect deploy implementation
        run: |
          npm pack @netlify/mcp@latest >/tmp/pkg.txt
          PKG=$(tail -1 /tmp/pkg.txt)
          mkdir pkg
          tar -xzf "$PKG" -C pkg
          sed -n '1680,1815p' pkg/package/dist/netlify-mcp.js
