name: Refresh JARVIS lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ contains(github.event.head_commit.message, 'fix(netlify)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gc-ai-os/pnpm-lock.yaml

      - name: Refresh lockfile
        working-directory: gc-ai-os
        run: pnpm install --lockfile-only

      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gc-ai-os/pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore(netlify): refresh JARVIS lockfile"
          git push
