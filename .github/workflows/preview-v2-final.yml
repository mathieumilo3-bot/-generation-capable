name: Preview V2 — validation finale

on:
  push:
    branches: [main]
    paths:
      - "site-vitrine/**"
      - ".github/workflows/preview-v2-final.yml"
  pull_request:
    paths:
      - "site-vitrine/**"
      - ".github/workflows/preview-v2-final.yml"

concurrency:
  group: preview-v2-final-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview-e2e:
    name: Preview V2 E2E final
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-vitrine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-vitrine/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/preview-v2.spec.ts --project=chromium --project=mobile
        env:
          CI: "true"
