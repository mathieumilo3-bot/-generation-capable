name: GC AI OS

on:
  pull_request:
    paths:
      - "gc-ai-os/**"
      - ".github/workflows/gc-ai-os.yml"
  push:
    branches: [main]
    paths:
      - "gc-ai-os/**"
      - ".github/workflows/gc-ai-os.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gc-ai-os
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gc-ai-os/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy-persistent-runtime:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: gc-jarvis-night-shift
      RUNTIME_URL: https://gc-jarvis-night-shift.fly.dev
    steps:
      - uses: actions/checkout@v4

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Provision Fly app and volume
        run: |
          set -euo pipefail
          if ! flyctl apps list --json | python -c 'import json,sys; data=json.load(sys.stdin); sys.exit(0 if any(x.get("Name")=="gc-jarvis-night-shift" for x in data) else 1)'; then
            flyctl apps create "$FLY_APP" --yes
          fi
          if ! flyctl volumes list --app "$FLY_APP" --json | python -c 'import json,sys; data=json.load(sys.stdin); sys.exit(0 if any(x.get("name")=="jarvis_data" or x.get("Name")=="jarvis_data" for x in data) else 1)'; then
            flyctl volumes create jarvis_data --app "$FLY_APP" --region cdg --size 10 --yes
          fi

      - name: Deploy persistent JARVIS runtime
        run: flyctl deploy --config gc-ai-os/fly.toml --app "$FLY_APP" --remote-only --wait-timeout 10m

      - name: Verify public runtime
        run: curl --fail --retry 10 --retry-delay 3 --retry-connrefused "$RUNTIME_URL/api/health"
