name: GC AI OS

on:
  pull_request:
    paths:
      - "gc-ai-os/**"
      - ".github/workflows/gc-ai-os.yml"
  push:
    branches: [main]
    paths:
      - "gc-ai-os/**"
      - ".github/workflows/gc-ai-os.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gc-ai-os
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gc-ai-os/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy-night-shift-ui:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gc-ai-os
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 045a06ee-a132-4fe0-a87d-0acd33bdc5d0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gc-ai-os/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Deploy Night Shift to Netlify
        run: npx --yes netlify-cli@latest deploy --build --prod --site-id "$NETLIFY_SITE_ID"
