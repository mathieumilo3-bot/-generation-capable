name: app-v1 EAS build (manuel)
on:
  workflow_dispatch:
    inputs:
      profile: { description: "development | staging | production", required: true, default: staging }
      platform: { description: "ios | android | all", required: true, default: all }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app-v1/apps/client } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - run: cd ../.. && npm ci
      - run: eas build --non-interactive --no-wait --profile "${{ inputs.profile }}" --platform "${{ inputs.platform }}"
