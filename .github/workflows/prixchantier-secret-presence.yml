name: PrixChantier deployment secret presence

on:
  push:
    branches:
      - ops/prixchantier-secure-deploy-20260927
    paths:
      - .github/workflows/prixchantier-secret-presence.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence without revealing values
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for name in NETLIFY_AUTH_TOKEN NETLIFY_TOKEN SUPABASE_SECRET_KEY SUPABASE_SERVICE_ROLE_KEY; do
            if [ -n "${!name}" ]; then
              echo "$name=present"
            else
              echo "$name=missing"
            fi
          done
