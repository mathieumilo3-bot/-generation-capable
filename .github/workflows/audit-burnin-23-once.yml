name: Audit — burn-in production 23 cas

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-burnin-23-once.yml"

permissions:
  contents: read

concurrency:
  group: audit-burnin-23-production
  cancel-in-progress: false

env:
  BASE_URL: https://gc-agence.com
  OBJECTIVE: "Augmenter la visibilité qualifiée et la transformer en davantage de demandes de devis et de prospects qualifiés."

jobs:
  public-pages:
    name: Pages publiques & contact email
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les pages critiques
        shell: bash
        run: |
          set -euo pipefail
          for path in / /audit /audit/merci /audit/rendez-vous /audit/reprendre /politique-de-confidentialite; do
            HTTP=$(curl -sS -L -o /tmp/page.html -w '%{http_code}' --max-time 30 "$BASE_URL$path")
            SIZE=$(wc -c </tmp/page.html)
            echo "$path -> HTTP $HTTP · ${SIZE} octets"
            test "$HTTP" = "200"
            test "$SIZE" -gt 1000
          done

      - name: Vérifier que l’email peut être enregistré
        shell: bash
        run: |
          set -euo pipefail
          EMAIL="gc-burnin-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          jq -n --arg email "$EMAIL" \
            '{action:"register",companyName:"GC Burnin Production",companyCity:"Paris",siteUrl:"https://gc-agence.com",email:$email,phone:"",marketingConsent:false,attribution:{source:"github_burnin"}}' >/tmp/contact.json
          HTTP=$(curl -sS -X POST "$BASE_URL/api/audit/contact" -H 'Content-Type: application/json' --data-binary @/tmp/contact.json -o /tmp/contact-response.json -w '%{http_code}' --max-time 30)
          echo "contact -> HTTP $HTTP"
          cat /tmp/contact-response.json | jq .
          test "$HTTP" = "200"
          jq -e '.status == "registered" and (.id|length) > 20 and (.token|length) > 20' /tmp/contact-response.json >/dev/null

  deep-audit:
    name: Audit réel — ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { name: "AATP Trojani", company: "AATP", city: "Bastelicaccia", sector: "Plomberie chauffage", site: "https://www.plomberie-climatisation-ajaccio.fr" }
          - { name: "L Artisan Plombier", company: "L'ARTISAN PLOMBIER", city: "Strasbourg", sector: "Plomberie", site: "https://www.lartisanplombier.com" }
          - { name: "Jean Baptiste F Couverture", company: "Jean Baptiste F couverture", city: "Cormeilles-en-Parisis", sector: "Couverture", site: "https://www.artisan-couvreur.fr" }
          - { name: "Menuiserie Chevrier", company: "Menuiserie Chevrier", city: "Grigny-sur-Rhône", sector: "Menuiserie", site: "https://www.menuiseriechevrier.fr" }
          - { name: "MBM Menuiserie", company: "MBM Menuiserie", city: "La Garnache", sector: "Menuiserie", site: "https://www.menuiserie-mbm.fr" }
          - { name: "Menuiserie Saint Georges", company: "Menuiserie Saint-Georges", city: "Chaneins", sector: "Menuiserie", site: "https://www.menuiserie-saint-georges.com" }
          - { name: "Le Paysagiste", company: "Le Paysagiste", city: "Saint-Hubert", sector: "Paysagiste", site: "https://www.lepaysagiste-artisan.fr" }
          - { name: "Artisan Menuiserie Renovation", company: "ARTISAN MENUISERIE RENOVATION", city: "Saint-Martin-la-Pallu", sector: "Menuiserie rénovation", site: "https://www.artisanmenuiserierenovation86.fr" }
          - { name: "M3 Menuiserie", company: "M3 Menuiserie", city: "Luscan", sector: "Menuiserie", site: "https://m3-menuiserie.fr" }
          - { name: "CJ Menuiserie", company: "CJ MENUISERIE", city: "Saint-Germain", sector: "Menuiserie", site: "https://cjm-menuiserie.fr" }
          - { name: "AFC Menuiserie", company: "A.F.C. MENUISERIE", city: "Saint-Christophe-du-Ligneron", sector: "Menuiserie", site: "https://afcmenuiserie.com" }
          - { name: "Lemaitre Menuiserie", company: "LEMAITRE MENUISERIE", city: "Saint-Germain-sur-Ay", sector: "Menuiserie", site: "https://www.lemaitremenuiserie.fr" }
          - { name: "Menuiseries de l AA", company: "MENUISERIES DE L'AA", city: "Lumbres", sector: "Menuiserie", site: "https://www.menuiserieaa.com" }
          - { name: "Menuiserie Le Franc", company: "SAS LE FRANC", city: "Saint-Nazaire", sector: "Menuiserie", site: "https://menuiserie-lefranc.fr" }
          - { name: "Menuiserie Piau", company: "MENUISERIE PIAU", city: "Nantes", sector: "Menuiserie", site: "https://www.menuiseriepiau.fr" }
          - { name: "Artisan Ciret", company: "Artisan Ciret", city: "Le Malesherbois", sector: "Plomberie chauffage rénovation énergétique", site: "https://www.artisanciret.com" }
          - { name: "CEGRI", company: "CEGRI SAS", city: "Montataire", sector: "Électricité", site: "https://cegrisas.fr" }
          - { name: "BRP Maconnerie", company: "BRP Maconnerie", city: "La Broque", sector: "Maçonnerie", site: "https://www.brp-maconnerie.com" }
          - { name: "Martin Concept Carrelage", company: "Martin Concept Carrelage", city: "Beaulieu-sous-la-Roche", sector: "Carrelage", site: "https://martinconceptcarrelage.fr" }
          - { name: "PMC Maconnerie", company: "PMC Maçonnerie", city: "Sarrola-Carcopino", sector: "Maçonnerie", site: "https://pmcmaconnerie.com" }
          - { name: "Camus Maconnerie", company: "Camus Maçonnerie", city: "Saint-Herblain", sector: "Maçonnerie", site: "https://www.macon-44.fr" }
          - { name: "ARTISAO", company: "ARTISAO", city: "La Chevallerais", sector: "Plomberie chauffage", site: "https://artisao.fr" }
          - { name: "FJ Maconnerie", company: "FJ MACONNERIE", city: "Béziers", sector: "Maçonnerie carrelage toiture", site: "https://fjmaconnerie.fr" }

    steps:
      - name: Lancer lecture site + enquête
        shell: bash
        env:
          COMPANY: ${{ matrix.company }}
          CITY: ${{ matrix.city }}
          SECTOR: ${{ matrix.sector }}
          SITE: ${{ matrix.site }}
        run: |
          set -euo pipefail
          START=$(date +%s)
          jq -n --arg e "$COMPANY" --arg s "$SITE" --arg sec "$SECTOR" --arg v "$CITY" \
            '{entreprise:$e,siteUrl:$s,secteur:$sec,ville:$v}' >/tmp/research-request.json
          HTTP=$(curl -sS -X POST "$BASE_URL/api/audit/research" -H 'Content-Type: application/json' --data-binary @/tmp/research-request.json -o /tmp/research.json -w '%{http_code}' --max-time 30)
          echo "research HTTP $HTTP · $(( $(date +%s) - START ))s"
          jq '{stats,hasContext:(.context != null),investigating:(.jobId != null)}' /tmp/research.json || cat /tmp/research.json
          test "$HTTP" = "200"
          jq -e '.context != null and .signature != null' /tmp/research.json >/dev/null

      - name: Attendre le diagnostic complet
        shell: bash
        run: |
          set -euo pipefail
          jq --arg objective "$OBJECTIVE" '{context,signature,jobId,token,objectif:$objective}' /tmp/research.json >/tmp/analyze-request.json
          START=$(date +%s)
          STATUS="pending"
          for i in $(seq 1 32); do
            HTTP=$(curl -sS -X POST "$BASE_URL/api/audit/analyze" -H 'Content-Type: application/json' --data-binary @/tmp/analyze-request.json -o /tmp/report.json -w '%{http_code}' --max-time 30)
            test "$HTTP" = "200"
            STATUS=$(jq -r '.status // "unknown"' /tmp/report.json)
            echo "poll $i -> $STATUS · $(( $(date +%s) - START ))s"
            if [ "$STATUS" = "done" ]; then break; fi
            if [ "$STATUS" = "failed" ]; then cat /tmp/report.json; exit 1; fi
            sleep 4
          done
          jq '{status,degradedTo,mode:.report.diagnostic.mode,pages:.report.diagnostic.pagesAnalyzed,queries:.report.diagnostic.queriesRun,sources:.report.diagnostic.sourcesConsulted,cards:[.report.diagnostic.cards[]? | {axis,title,score,potential,fix}]}' /tmp/report.json
          jq -e '.status == "done"' /tmp/report.json >/dev/null
          jq -e '.report.diagnostic.cards | length >= 1 and length <= 3' /tmp/report.json >/dev/null
          jq -e '[.report.diagnostic.cards[] | select((.title|length) > 8 and (.finding|length) > 20 and (.fix|length) > 20)] | length >= 1' /tmp/report.json >/dev/null

  discovery-check:
    name: Identification — ${{ matrix.company }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { company: "AATP", city: "Bastelicaccia" }
          - { company: "Menuiserie Chevrier", city: "Grigny-sur-Rhône" }
          - { company: "M3 Menuiserie", city: "Luscan" }
          - { company: "ARTISAO", city: "La Chevallerais" }
          - { company: "FJ MACONNERIE", city: "Béziers" }
          - { company: "CEGRI SAS", city: "Montataire" }
          - { company: "PMC Maçonnerie", city: "Sarrola-Carcopino" }
          - { company: "L'ARTISAN PLOMBIER", city: "Strasbourg" }
    steps:
      - name: Retrouver l’entreprise depuis son nom
        shell: bash
        env:
          COMPANY: ${{ matrix.company }}
          CITY: ${{ matrix.city }}
        run: |
          set -euo pipefail
          jq -n --arg n "$COMPANY" --arg c "$CITY" '{companyName:$n,cityHint:$c}' >/tmp/discover-start.json
          HTTP=$(curl -sS -X POST "$BASE_URL/api/audit/discover" -H 'Content-Type: application/json' --data-binary @/tmp/discover-start.json -o /tmp/start.json -w '%{http_code}' --max-time 30)
          echo "start HTTP $HTTP"
          cat /tmp/start.json | jq .
          test "$HTTP" = "200"
          STATUS=$(jq -r '.status // "unknown"' /tmp/start.json)
          if [ "$STATUS" = "done" ]; then
            cp /tmp/start.json /tmp/final.json
          else
            JOB=$(jq -r '.jobId // empty' /tmp/start.json)
            TOKEN=$(jq -r '.token // empty' /tmp/start.json)
            test -n "$JOB"
            test -n "$TOKEN"
            for i in $(seq 1 28); do
              sleep 2
              jq -n --arg n "$COMPANY" --arg c "$CITY" --arg j "$JOB" --arg t "$TOKEN" '{companyName:$n,cityHint:$c,jobId:$j,token:$t}' >/tmp/poll-request.json
              HTTP=$(curl -sS -X POST "$BASE_URL/api/audit/discover" -H 'Content-Type: application/json' --data-binary @/tmp/poll-request.json -o /tmp/final.json -w '%{http_code}' --max-time 30)
              test "$HTTP" = "200"
              STATUS=$(jq -r '.status // "unknown"' /tmp/final.json)
              echo "poll $i -> $STATUS"
              if [ "$STATUS" = "done" ]; then break; fi
              if [ "$STATUS" = "failed" ]; then cat /tmp/final.json; exit 1; fi
            done
          fi
          cat /tmp/final.json | jq '{status,candidates:[.candidates[]? | {name,website,city,confidence}]}'
          jq -e '.status == "done"' /tmp/final.json >/dev/null
          jq -e '.candidates | length >= 1' /tmp/final.json >/dev/null
