name: PrixChantier prebuilt Netlify deploy

on:
  push:
    branches:
      - "prixchantier/prebuilt-netlify-20260926"
    paths:
      - ".github/workflows/prixchantier-prebuilt-netlify.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://wcrpxrcbbigswcqufhik.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_FmZD6eTYf_VWIb65iGaMug_H0Uocfry"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app and temporary Netlify runtime
        working-directory: prixchantier
        run: |
          npm ci
          npm install --no-save @netlify/plugin-nextjs@5.16.0
      - name: Build deploy-ready Netlify output locally
        working-directory: prixchantier
        run: |
          cp netlify.toml /tmp/netlify-original.toml 2>/dev/null || true
          cat > netlify.toml <<'EOF'
          [build]
            command = "npm run build"

          [[plugins]]
            package = "@netlify/plugin-nextjs"
          EOF
          mkdir -p .netlify
          printf '{"siteId":"043f9a8f-7a88-4f95-b3c8-85b8c5606799"}' > .netlify/state.json
          npx -y netlify-cli@latest build --offline
          rm -rf prebuilt-netlify
          mv .netlify prebuilt-netlify
          cat > netlify.toml <<'EOF'
          [build]
            command = "rm -rf .netlify && cp -a prebuilt-netlify .netlify"
            publish = ".netlify/static"

          [build.environment]
            NODE_VERSION = "22"
          EOF
      - name: Deploy prebuilt runtime through Netlify build
        working-directory: prixchantier
        run: npx -y @netlify/mcp@latest --site-id 043f9a8f-7a88-4f95-b3c8-85b8c5606799 --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..O41OeM03jwYZ6ziI.L8XPrRknT_ZM9MzkV237Hv3cwSAI7i9M9jLh99_8CTIjz7vDBbtr4xfj86a7g1zxhmS5JdNskDUGA0CPwwGR0IkTd8tMeddUtSMWj9zGcOk5q_eu4szdLzT_PTAzMUjZNiWbdZv73VOp7ru1-yOh5doPmj-pweS-CUkafWfPPOTLPS7bcSMJ1WXDL2kiUqeEO3uFWgF8LOumdCbNn4iqPVfjkMva4XWAdT77f7iy56dzGei0iRfYZL3m6BXJ2M2ABu23ni7feAUh5HP_E0ptmkrc2N6OcpAaJCzMyP7JYmWE-2UAYDBDvcwuLgbHkdkizQUeXT64Vzrdsn0x9fq4p2YIS2rVO4FvaNcwWwtg9h2o8nt4lBJLlAbaodKzcuF1aH1smY6K.B60Mn2omEa9wpyBrr-unMA"
