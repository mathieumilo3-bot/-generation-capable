name: PrixChantier prebuilt Netlify deploy

on:
  push:
    branches:
      - "prixchantier/prebuilt-netlify-20260926"
    paths:
      - ".github/workflows/prixchantier-prebuilt-netlify.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://wcrpxrcbbigswcqufhik.supabase.co"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_FmZD6eTYf_VWIb65iGaMug_H0Uocfry"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app and temporary Netlify runtime
        working-directory: prixchantier
        run: |
          npm ci
          npm install --no-save @netlify/plugin-nextjs@5.16.0
      - name: Build deploy-ready Netlify output locally
        working-directory: prixchantier
        run: |
          cat > netlify.toml <<'EOF'
          [build]
            command = "npm run build"

          [[plugins]]
            package = "@netlify/plugin-nextjs"
          EOF
          mkdir -p .netlify
          printf '{"siteId":"043f9a8f-7a88-4f95-b3c8-85b8c5606799"}' > .netlify/state.json
          npx -y netlify-cli@latest build --offline
          rm -rf prebuilt-netlify
          mv .netlify prebuilt-netlify

          cat > netlify.toml <<'EOF'
          [build]
            command = "rm -rf .netlify && cp -a prebuilt-netlify .netlify && rm -rf .netlify/functions-internal .netlify/edge-functions"
            publish = ".netlify/static"

          [build.environment]
            NODE_VERSION = "22"
          EOF
      - name: Deploy already-packaged Netlify runtime
        working-directory: prixchantier
        run: npx -y @netlify/mcp@latest --site-id 043f9a8f-7a88-4f95-b3c8-85b8c5606799 --proxy-path "https://netlify-mcp.netlify.app/proxy/eyJhbGciOiJkaXIiLCJlbmMiOiJBMjU2R0NNIn0..F6Tl7053FZ14UeLH.ICJxIz1zCohz0j3i4OCIrFpLsMfCp3hk52u2iSw3XIUT9UCVs3RsM3MSt3i5GSG2asI5b70ub1s6-4JLnH4aeB11Cz95-hcoCF_xK4p2tuSzZeufeXhndnMdLGvPYeUS78Mr3AmVTuCmK_dYbczppZshTlVXsv9jn-jTdFf_KTo7ZCqPJOYd5ipYL-EBfdcmBuemhUoSza5Pf3gRlaVOcXOttR4evuIgyWhRWP3STEyachOKWlnsRJaX4AFm8OBjvDUmWz5tK1FZe6CQo0zLh9fQ5cV3ma1Aikki6bo8FUPs3xppUM2ocxWbJA18LX_BYGCrfSy3qE0f97aJiJdTt64xBLfleH_08rjx-1ny2iCTNeQsZwAFKbgrZysPn6NviJngoTX8.Cthi3KoT1yadxGqCp0t9Uw"
