name: Site vitrine — diagnostic CI

on:
  pull_request:
    paths:
      - "site-vitrine/**"
      - ".github/workflows/site-vitrine-debug.yml"

defaults:
  run:
    working-directory: site-vitrine

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-vitrine/package-lock.json

      - name: Install with captured log
        id: install
        shell: bash
        run: |
          set +e
          npm ci > ../ci-install.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Lint with captured log
        id: lint
        if: steps.install.outputs.code == '0'
        shell: bash
        run: |
          set +e
          npm run lint > ../ci-lint.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Unit tests with captured log
        id: unit
        if: steps.install.outputs.code == '0'
        shell: bash
        run: |
          set +e
          npm run test > ../ci-unit.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build with captured log
        id: build
        if: steps.install.outputs.code == '0'
        shell: bash
        run: |
          set +e
          npm run build > ../ci-build.log 2>&1
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-vitrine-ci-diagnostics
          path: ci-*.log
          retention-days: 1

      - name: Surface final status
        if: always()
        shell: bash
        run: |
          echo "install=${{ steps.install.outputs.code }}"
          echo "lint=${{ steps.lint.outputs.code }}"
          echo "unit=${{ steps.unit.outputs.code }}"
          echo "build=${{ steps.build.outputs.code }}"
          test "${{ steps.install.outputs.code }}" = "0"
          test "${{ steps.lint.outputs.code }}" = "0"
          test "${{ steps.unit.outputs.code }}" = "0"
          test "${{ steps.build.outputs.code }}" = "0"
