name: Install Netlify Next runtime

on:
  push:
    branches:
      - "prixchantier/netlify-deploy-20260926"
    paths:
      - ".github/workflows/prixchantier-install-netlify-runtime.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: prixchantier/netlify-deploy-20260926
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime
        working-directory: prixchantier
        run: npm install -D @netlify/plugin-nextjs@5.16.0
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prixchantier/package.json prixchantier/package-lock.json
          git commit -m "fix: install Netlify Next.js runtime"
          git push origin HEAD:prixchantier/netlify-deploy-20260926
