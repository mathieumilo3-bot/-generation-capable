name: Site vitrine — CI

on:
  push:
    branches: [main]
    paths:
      - "site-vitrine/**"
      - ".github/workflows/site-vitrine-ci.yml"
  pull_request:
    paths:
      - "site-vitrine/**"
      - ".github/workflows/site-vitrine-ci.yml"

concurrency:
  group: site-vitrine-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site-vitrine

jobs:
  verify:
    name: Lint, tests unitaires et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-vitrine/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    name: Tests end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-vitrine/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: site-vitrine/playwright-report/
          retention-days: 7
