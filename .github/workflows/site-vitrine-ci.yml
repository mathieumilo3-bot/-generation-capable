name: Site vitrine — CI

# Preview V2 final validation

on:
  push:
    branches: [main]
    paths:
      - "site-vitrine/**"
      - ".github/workflows/site-vitrine-ci.yml"
  pull_request:
    paths:
      - "site-vitrine/**"
      - ".github/workflows/site-vitrine-ci.yml"

concurrency:
  group: site-vitrine-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site-vitrine

jobs:
  verify:
    name: Lint, tests unitaires et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-vitrine/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  e2e:
    name: Tests end-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Sharded by project: the full suite (chromium + mobile, ~150 specs
        # each) fighting over one 2-core runner is what made the CLS budget
        # and the preview funnel's polling loop flaky, not a product bug —
        # each shard now gets a runner to itself.
        project: [chromium, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site-vitrine/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }}
        env:
          # Covered in true isolation by the "Preview V2 E2E final" job
          # instead — see playwright.config.ts.
          SKIP_PREVIEW_V2: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}
          path: site-vitrine/playwright-report/
          retention-days: 7
