name: Deploy Video OS to Fly.io

on:
  workflow_dispatch:
  push:
    paths:
      - 'video-os.html'
      - 'video-os-v12.html'
      - 'video-os-v13.html'
      - 'Dockerfile.video-os'
      - 'fly.video-os.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          fly apps create generation-capable-video-os-1306948595 || true
          fly deploy --config fly.video-os.toml --dockerfile Dockerfile.video-os --remote-only
