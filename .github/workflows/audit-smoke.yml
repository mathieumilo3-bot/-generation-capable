name: Audit — test de fumée en production

# Manual only: each run exercises the real diagnostic pipeline on the
# deployed site (crawl + OpenAI background job), so it is a deliberate check
# after a deploy, not something to run on every push.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site à tester"
        required: false
        default: "https://gc-agence.com"
      case:
        description: "Entreprise de la liste de test (voir /api/audit/self-test)"
        required: false
        default: "gc"
      journey_site:
        description: "Site à passer au parcours public (comme après l'identification)"
        required: false
        default: "https://gc-agence.com"

jobs:
  smoke:
    name: Diagnostic complet sur l'hébergement réel
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier l'accès au modèle
        run: |
          set -euo pipefail
          HTTP=$(curl -sS -o health.json -w '%{http_code}' --max-time 30 "${{ inputs.base_url }}/api/audit/ai-health")
          echo "HTTP $HTTP"
          jq . health.json || cat health.json

      - name: Démarrer le diagnostic
        id: start
        run: |
          set -euo pipefail
          URL="${{ inputs.base_url }}/api/audit/self-test?case=${{ inputs.case }}"
          echo "POST $URL"
          START=$(date +%s)
          HTTP=$(curl -sS -o start.json -w '%{http_code}' --max-time 30 "$URL")
          ELAPSED=$(( $(date +%s) - START ))
          echo "HTTP $HTTP en ${ELAPSED}s"
          cat start.json | jq . || cat start.json
          test "$HTTP" = "200"
          # The whole point of the two-stage design: this request must land
          # well inside the host's 10 s limit.
          jq -e '.withinRequestBudget == true' start.json > /dev/null
          jq -e '.site.reachable == true' start.json > /dev/null
          jq -e '.backgroundMode == true' start.json > /dev/null
          echo "job=$(jq -r .job start.json)" >> "$GITHUB_OUTPUT"

      - name: Attendre et relever le diagnostic
        run: |
          set -euo pipefail
          URL="${{ inputs.base_url }}/api/audit/self-test?case=${{ inputs.case }}&job=${{ steps.start.outputs.job }}"
          START=$(date +%s)
          for i in $(seq 1 40); do
            sleep 6
            HTTP=$(curl -sS -o poll.json -w '%{http_code}' --max-time 30 "$URL")
            STATUS=$(jq -r '.status // "http_'"$HTTP"'"' poll.json)
            echo "[$i] HTTP $HTTP · $STATUS · $(( $(date +%s) - START ))s"
            if [ "$STATUS" = "done" ] || [ "$STATUS" = "failed" ]; then break; fi
          done
          echo "--- Diagnostic rendu en $(( $(date +%s) - START ))s ---"
          jq . poll.json || cat poll.json

          # Un échec de facturation n'est pas un bug du moteur : le dire
          # clairement plutôt que de laisser chercher dans le code.
          if jq -e '.reason // "" | test("credit_balance_exhausted|insufficient_quota")' poll.json > /dev/null; then
            echo "::error::Le compte OpenAI n'a plus de crédits : la recherche web et la rédaction IA sont indisponibles. Le diagnostic continue en mode site seul. Recharger sur https://platform.openai.com/settings/organization/billing/"
            exit 1
          fi

          jq -e '.status == "done"' poll.json > /dev/null
          jq -e '.cards | length >= 1' poll.json > /dev/null

  journey:
    name: Parcours public réel (recherche puis diagnostic)
    runs-on: ubuntu-latest
    steps:
      - name: Étape 1 — lecture du site et lancement de l'enquête
        run: |
          set -euo pipefail
          curl -sS -X POST "${{ inputs.base_url }}/api/audit/research" \
            -H 'Content-Type: application/json' \
            --max-time 30 \
            -d '{"entreprise":"GC Agence","siteUrl":"${{ inputs.journey_site }}","secteur":"Agence web","ville":""}' \
            -o research.json -w 'HTTP %{http_code} en %{time_total}s\n'
          jq '{stats, hasContext: (.context != null), investigating: (.jobId != null)}' research.json
          # Même sans enquête IA, cette étape doit rendre un contexte signé.
          jq -e '.context != null and .signature != null' research.json > /dev/null
          jq -e '.stats.pagesAnalyzed >= 1' research.json > /dev/null

      - name: Étape 2 — diagnostic rendu au visiteur
        run: |
          set -euo pipefail
          jq '{context, signature, jobId, token, objectif: ""}' research.json > analyze.json
          for i in $(seq 1 25); do
            curl -sS -X POST "${{ inputs.base_url }}/api/audit/analyze" \
              -H 'Content-Type: application/json' --max-time 30 \
              -d @analyze.json -o report.json -w 'HTTP %{http_code}\n'
            STATUS=$(jq -r '.status // "?"' report.json)
            echo "[$i] $STATUS"
            if [ "$STATUS" != "pending" ]; then break; fi
            sleep 6
          done
          jq '{status, degradedTo, mode: .report.diagnostic.mode, pages: .report.diagnostic.pagesAnalyzed, queries: .report.diagnostic.queriesRun, cards: [.report.diagnostic.cards[] | {axis, title, score, potential}]}' report.json
          jq -e '.report.diagnostic.cards | length >= 1' report.json > /dev/null
          # Un diagnostic sans action concrète ne vaut rien : on l'exige.
          jq -e '[.report.diagnostic.cards[] | select((.fix | length) > 20 and (.seen | length) > 10)] | length >= 1' report.json > /dev/null
