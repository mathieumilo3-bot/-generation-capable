name: Check PrixChantier live

on:
  push:
    branches:
      - "prixchantier/netlify-deploy-20260926"
    paths:
      - ".github/workflows/prixchantier-netlify-deploy.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check home
        run: |
          set -e
          code=$(curl -L -sS -o /tmp/home.html -w "%{http_code}" https://prixchantier.netlify.app/)
          echo "HTTP=$code"
          head -c 1200 /tmp/home.html | sed 's/</\n</g' | head -40
          test "$code" = "200"
