name: Check PrixChantier live

on:
  push:
    branches:
      - "prixchantier/netlify-deploy-20260926"
    paths:
      - ".github/workflows/prixchantier-netlify-deploy.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check routes
        run: |
          set -e
          for path in / /login /signup /forgot-password; do
            code=$(curl -L -sS -o /tmp/body.html -w "%{http_code}" "https://prixchantier.netlify.app$path")
            title=$(grep -o '<title>[^<]*' /tmp/body.html | head -1 | sed 's/<title>//')
            echo "$path HTTP=$code TITLE=$title"
          done
          code=$(curl -L -sS -o /tmp/login.html -w "%{http_code}" https://prixchantier.netlify.app/login)
          test "$code" = "200"
