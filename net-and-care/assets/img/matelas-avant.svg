<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Matelas 140×190 — avant nettoyage (visuel provisoire)">
  <defs>
    <linearGradient id="mur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f7f4"/>
      <stop offset="1" stop-color="#f1efe9"/>
    </linearGradient>
    <filter id="flou"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.2"/></feComponentTransfer>
    </filter>
    <radialGradient id="lum" cx="50%" cy="26%" r="80%">
      <stop offset="0" stop-color="#d8c9a8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.36"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="900" fill="url(#mur)"/>
  <ellipse cx="600" cy="726" rx="500" ry="52" fill="#000" opacity=".12"/>
  
    <rect x="130" y="280" width="940" height="360" rx="40" fill="#9b9284"/>
    <rect x="130" y="430" width="940" height="26" fill="#7c756a" opacity=".5"/>
    <g fill="#7c756a" opacity=".45">
      <circle cx="300" cy="355" r="9"/><circle cx="300" cy="545" r="9"/><circle cx="500" cy="355" r="9"/><circle cx="500" cy="545" r="9"/><circle cx="700" cy="355" r="9"/><circle cx="700" cy="545" r="9"/><circle cx="900" cy="355" r="9"/><circle cx="900" cy="545" r="9"/>
    </g>
    <rect x="160" y="640" width="880" height="60" rx="18" fill="#4a3d31"/>
  
    <g filter="url(#flou)" opacity=".75">
      <ellipse cx="420" cy="455" rx="124" ry="78" fill="#57401f"/>
      <ellipse cx="760" cy="430" rx="78" ry="52" fill="#4b3720"/>
      <ellipse cx="610" cy="520" rx="56" ry="32" fill="#5c4726"/>
      <ellipse cx="880" cy="500" rx="44" ry="28" fill="#584626"/>
      <ellipse cx="300" cy="560" rx="90" ry="40" fill="#4f402c"/>
    </g>
    <g opacity=".3">
      <circle cx="330" cy="400" r="7" fill="#4a3c2c"/>
      <circle cx="520" cy="380" r="5" fill="#4a3c2c"/>
      <circle cx="700" cy="560" r="6" fill="#4a3c2c"/>
    </g>
  <rect width="1200" height="900" fill="url(#lum)"/>
  <rect width="1200" height="900" filter="url(#fibre)" opacity=".75"/>

  <g opacity=".62">
    <rect x="28" y="824" width="250" height="48" rx="12" fill="#07202b" opacity=".55"/>
    <text x="48" y="854" font-family="Helvetica,Arial,sans-serif" font-size="22" fill="#ffffff">Visuel provisoire</text>
  </g>
</svg>
