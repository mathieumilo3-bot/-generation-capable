<!doctype html>
<html lang="fr">
<!-- ===========================================================================
     Source de l'image de partage (Open Graph) : assets/img/og-netandcare.png.
     C'est la vignette qui s'affiche quand un lien du site est collé dans
     WhatsApp, Messenger, Instagram ou Google Business.

     REGÉNÉRER après modification (capture 1200 × 630) :
       npx playwright screenshot --viewport-size=1200,630 \
         net-and-care/tools/og-source.html \
         net-and-care/assets/img/og-netandcare.png

     Un PNG plutôt qu'un SVG : aucun réseau social ne sait afficher un SVG en
     aperçu de lien.
     =========================================================================== -->
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Instrument+Serif:ital@1&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; display: flex; overflow: hidden;
    font-family: 'Manrope', Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #07202b 0%, #0e4557 62%, #0e7c86 100%);
    color: #fff; position: relative;
  }
  .glow {
    position: absolute; width: 760px; height: 760px; right: -220px; top: -280px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(18,179,168,.5), rgba(18,179,168,0) 68%);
  }
  .inner { position: relative; padding: 68px 72px; display: flex; flex-direction: column; height: 100%; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .mark { width: 74px; height: 74px; border-radius: 20px; }
  .name { font-size: 40px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .tag { font-size: 15px; letter-spacing: .22em; text-transform: uppercase; color: #8fc9cc; margin-top: 7px; }
  h1 { margin-top: auto; font-size: 66px; line-height: 1.06; letter-spacing: -.03em; font-weight: 800; max-width: 15ch; }
  h1 em { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; }
  p { margin-top: 22px; font-size: 25px; color: #a9c6cd; max-width: 26ch; }
  .foot { margin-top: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .chip {
    border: 1.5px solid rgba(255,255,255,.28); border-radius: 999px;
    padding: 11px 22px; font-size: 19px; font-weight: 700;
  }
  .chip--full { background: #12b3a8; border-color: #12b3a8; color: #04222a; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="inner">
    <div class="brand">
      <svg class="mark" viewBox="0 0 48 48">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e7c86"/><stop offset="1" stop-color="#12b3a8"/></linearGradient></defs>
        <rect width="48" height="48" rx="13" fill="url(#g)"/>
        <path d="M24 11c-4.6 4.9-8 9.3-8 13.6a8 8 0 0 0 16 0C32 20.3 28.6 15.9 24 11z" fill="#fff"/>
        <path d="M17.5 30.5c2.6 2 4.9 2.6 6.5 2.6s3.9-.6 6.5-2.6" stroke="#0e4557" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="name">Net&nbsp;&amp;&nbsp;Care</div>
        <div class="tag">Nettoyage textile</div>
      </div>
    </div>

    <h1>Canapé, matelas, tapis <em>comme neufs</em></h1>
    <p>Nettoyage à domicile à Cannes, Antibes et Grasse.</p>

    <div class="foot">
      <span class="chip chip--full">Devis en 60 secondes</span>
      <span class="chip">Intervention sous 48 h</span>
      <span class="chip">Déplacement inclus</span>
    </div>
  </div>
</body>
</html>
