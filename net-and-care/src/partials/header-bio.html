<!-- En-tête de la page « lien en bio ».
     Aucune navigation : quelqu'un qui arrive de TikTok n'explore pas un site,
     il vérifie que l'entreprise est réelle puis écrit. Chaque lien
     supplémentaire ici est une occasion de partir ailleurs. -->
<header class="bio-header">
  <div class="wrap bio-header__inner">
    <a class="logo" href="/" aria-label="{{nom}} — voir le site">
      <svg class="logo__mark" viewBox="0 0 48 48" role="img" aria-hidden="true" focusable="false">
        <defs><linearGradient id="lgb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e7c86"/><stop offset="1" stop-color="#12b3a8"/></linearGradient></defs>
        <rect width="48" height="48" rx="13" fill="url(#lgb)"/>
        <path d="M24 11c-4.6 4.9-8 9.3-8 13.6a8 8 0 0 0 16 0C32 20.3 28.6 15.9 24 11z" fill="#fff" opacity=".95"/>
        <path d="M17.5 30.5c2.6 2 4.9 2.6 6.5 2.6s3.9-.6 6.5-2.6" stroke="#0e4557" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </svg>
      <span class="logo__text">
        <span class="logo__name">Net&nbsp;&amp;&nbsp;Care</span>
        <span class="logo__tag">Cannes · Antibes · Grasse</span>
      </span>
    </a>
    <a class="bio-header__link" href="/">Voir le site</a>
  </div>
</header>
