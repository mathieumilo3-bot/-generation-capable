<!-- Barre d'action mobile : toujours visible, deux issues seulement —
     le simulateur (chemin principal) et l'appel direct (prospect pressé). -->
<div class="dock" role="group" aria-label="Actions rapides">
  <a class="btn btn--primary" href="{{home}}#simulateur" data-track="cta-dock">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    Obtenir mon devis
  </a>
  <a class="btn btn--ghost" href="tel:{{tel}}" aria-label="Appeler {{nom}} au {{telAffichage}}" data-track="tel-dock">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.4 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.4 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
  </a>
</div>
