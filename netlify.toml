[build]
  functions = "netlify/functions"

# Système de notifications — fonctions programmées (Netlify Scheduled
# Functions). Les fonctions suffixées "-background" bénéficient d'un budget
# d'exécution de 15 minutes (au lieu de 10s) : nécessaire pour parcourir
# l'ensemble des vendeurs/leads à chaque passage. Voir
# docs/notifications-system.md pour le détail de chaque job.
[functions."notify-cron-coach-background"]
  schedule = "*/30 * * * *"
[functions."notify-cron-leads-background"]
  schedule = "*/15 * * * *"
[functions."notify-cron-crm-scan-background"]
  schedule = "*/10 * * * *"
[functions."notify-cron-healthcheck"]
  schedule = "*/10 * * * *"
[functions."notify-cron-compliance-expiry"]
  schedule = "0 7 * * *"
# Gains ambassadeurs : passage quotidien, idempotent côté SQL (voir la
# fonction — repasser ne crédite jamais deux fois le même mois).
[functions."cron-ambassador-earnings"]
  schedule = "0 6 * * *"

# En-têtes de sécurité de base. Pas de Content-Security-Policy : le site
# repose entièrement sur des <script> et des attributs onclick= inline sans
# nonce, une CSP stricte casserait toute interactivité. Ajouter une CSP est
# un chantier à part (nonces ou hashes sur chaque script inline) — voir audit.
# Liens de parrainage ambassadeurs : generationcapable.fr/<slug>
#
# Netlify sert TOUJOURS un fichier réel en priorité sur une règle de
# redirection (tant qu'on ne met pas force = true). Cette règle attrape donc
# uniquement les chemins qui ne correspondent à aucun fichier du site :
# /index.html, /ambassadors.html, /sw.js, /manifest.json et
# /.netlify/functions/* continuent de fonctionner normalement.
#
# Le slug n'est PAS validé ici — c'est referral-track.js qui tranche côté
# serveur. Un chemin inconnu (faute de frappe, vieux lien) affiche donc
# simplement la page d'accueil, sans erreur pour le visiteur.
#
# ⚠️ INCIDENT DU 04/08 — À LIRE AVANT DE TOUCHER À CETTE SECTION.
#   Cette règle est un rewrite (status 200) : elle renvoie le CONTENU de
#   index.html, soit 464 Ko. Tout chemin sans fichier correspondant était donc
#   servi à 464 Ko — y compris /favicon.ico et /apple-touch-icon.png, que
#   chaque iPhone réclame automatiquement à chaque visite. Résultat : environ
#   1,4 Mo gaspillé par visiteur, quatre fois le poids réel de la page. Le
#   quota de bande passante Netlify a été épuisé en quelques heures le jour du
#   lancement, et le site a été mis en pause par Netlify.
#
#   Correctif : ces fichiers existent désormais réellement à la racine
#   (favicon.ico, apple-touch-icon*.png, robots.txt, sitemap.xml). Netlify
#   sert toujours un fichier réel AVANT d'appliquer une règle de redirection :
#   ils ne peuvent donc plus tomber dans ce rewrite.
#
#   RÈGLE À RESPECTER : avant d'ajouter un fichier attendu par un navigateur
#   ou un service tiers, créer le fichier — ne jamais compter sur ce rewrite
#   pour absorber un chemin manquant.
#
#   Les règles 404 ci-dessous couvrent les chemins qu'on ne peut pas créer à
#   l'avance (sondes de sécurité, robots) et qui, sinon, coûteraient 464 Ko
#   chacun.

# Chemins systématiquement sondés par des robots : 404 immédiat, quelques
# octets, au lieu de 464 Ko de page d'accueil.
[[redirects]]
  from = "/.well-known/*"
  to = "/404-empty"
  status = 404

[[redirects]]
  from = "/wp-admin/*"
  to = "/404-empty"
  status = 404

[[redirects]]
  from = "/wp-login.php"
  to = "/404-empty"
  status = 404

[[redirects]]
  from = "/.env"
  to = "/404-empty"
  status = 404

[[redirects]]
  from = "/:slug"
  to = "/index.html?ref=:slug"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # HSTS : impose le HTTPS pour les visites suivantes, y compris si
    # quelqu'un tape "generationcapable.fr" sans protocole. Sans cet en-tête,
    # la toute première requête part en clair et peut être détournée sur un
    # réseau hostile (wifi public) avant même la redirection vers HTTPS.
    # 2 ans, sous-domaines inclus — valeur attendue pour un site qui traite
    # des paiements.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    # Empêche le navigateur d'envoyer les identifiants enregistrés vers un
    # autre site en cas d'ouverture croisée.
    Cross-Origin-Opener-Policy = "same-origin"

# Les pièces justificatives (identité, RIB) et les contrats signés ne doivent
# jamais être mis en cache par un intermédiaire, ni indexés.
[[headers]]
  for = "/.netlify/functions/compliance-*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex, nofollow"
