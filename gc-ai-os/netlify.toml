# Independent JARVIS deployment: keep the Next runtime plugin explicit for API routes.
# CI verification trigger after the lockfile refresh.
[build]
  command = "pnpm --filter @gc-ai-os/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[plugins]]
  package = "@netlify/plugin-nextjs"
