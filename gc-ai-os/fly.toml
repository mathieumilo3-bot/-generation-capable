app = "gc-jarvis-night-shift"
primary_region = "cdg"

[build]
  dockerfile = "gc-ai-os/Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "2048mb"
  cpu_kind = "shared"
  cpus = 2

[[mounts]]
  source = "jarvis_data"
  destination = "/app/gc-ai-os/apps/web/.data"
  initial_size = "10gb"
