<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vérification GC Shield</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;padding:24px}.card{max-width:560px;width:100%;background:#0d0d0d;border:1px solid rgba(229,185,74,.2);border-radius:18px;padding:28px}.ey{color:#E5B94A;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.title{font-size:30px;font-weight:850;margin:10px 0}.muted{color:rgba(255,255,255,.66);line-height:1.6}.result{margin-top:22px;padding:16px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}.ok{color:#30d158}.bad{color:#ff9f0a}input{width:100%;box-sizing:border-box;margin-top:18px;background:#141414;border:1px solid rgba(255,255,255,.12);border-radius:12px;color:#fff;padding:13px}button{margin-top:10px;width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;background:#E5B94A;color:#1a1300;cursor:pointer}
</style>
</head>
<body>
  <main class="card">
    <div class="ey">GC Shield v2</div>
    <h1 class="title">Vérifier l’authenticité d’un site</h1>
    <p class="muted">Entre l’identifiant unique affiché sur un site Génération Capable pour confirmer qu’il est bien enregistré et actif.</p>
    <input id="sig" placeholder="GC-2026-...">
    <button onclick="verify()">Vérifier</button>
    <div class="result" id="result">En attente d’un identifiant.</div>
  </main>
<script>
const params = new URLSearchParams(location.search); if(params.get('id')) document.getElementById('sig').value = params.get('id');
async function verify(){
  const id = document.getElementById('sig').value.trim();
  const box = document.getElementById('result');
  if(!id){ box.textContent = 'Entre un identifiant.'; return; }
  box.textContent = 'Vérification en cours...';
  try{
    const r = await fetch('/.netlify/functions/gc-shield-signature?id=' + encodeURIComponent(id));
    const data = await r.json();
    box.textContent = '';
    const strong = document.createElement('strong');
    if(data.valid){
      strong.className = 'ok';
      strong.textContent = '✓ Signature active';
      box.append(strong, document.createElement('br'), 'Identifiant : ' + id);
      if(data.signature?.site_url) box.append(document.createElement('br'), 'Site : ' + data.signature.site_url);
    } else {
      strong.className = 'bad';
      strong.textContent = '⚠ Signature introuvable ou inactive';
      box.append(strong, document.createElement('br'), 'Ne procède pas à un paiement hors plateforme.');
    }
  }catch(e){
    box.textContent = '';
    const strong = document.createElement('strong');
    strong.className = 'bad';
    strong.textContent = 'Erreur de vérification';
    box.append(strong, document.createElement('br'), 'Réessaie dans quelques instants.');
  }
}
if(document.getElementById('sig').value) verify();
</script>
</body>
</html>
