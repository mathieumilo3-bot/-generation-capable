<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Anton";src:url(fonts/fontsource-anton-5.3.0/files/anton-latin-400-normal.woff2)}
@font-face{font-family:"Open Sans";font-weight:400;src:url(fonts/fontsource-open-sans-5.3.0/files/open-sans-latin-400-normal.woff2)}
@font-face{font-family:"Open Sans";font-weight:700;src:url(fonts/fontsource-open-sans-5.3.0/files/open-sans-latin-700-normal.woff2)}
@font-face{font-family:"Open Sans";font-weight:800;src:url(fonts/fontsource-open-sans-5.3.0/files/open-sans-latin-800-normal.woff2)}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body>
<canvas id="c"></canvas>
<script>
const REEL = /*REEL*/null, FMT = /*FMT*/null;
const [W, H] = REEL.formats[FMT], V = H > W, A = "assets/", T = REEL.T, FPS = REEL.fps, B = 60 / REEL.bpm;  // B : un temps
const cv = document.getElementById("c"); cv.width = W; cv.height = H;
const g = cv.getContext("2d");
const layer = () => { const c = document.createElement("canvas"); c.width = W; c.height = H; return [c, c.getContext("2d")]; };
const [wc, wg] = layer(), [sc, sg] = layer(), [rc, rg] = layer();

/* ---------- charte O NET (couleurs relevées sur la couverture du support) ---------- */
const C = { cream: "#EDE8DE", paper: "#F6F2EA", brown: "#5A4214", navy: "#0E1F3D", ink: "#081120",
  blue: "#2F8FE6", sky: "#8FD0FF", orange: "#F2683A", white: "#FFFFFF" };

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const smooth = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeOutExpo = x => { x = clamp(x); return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); };
const easeOutBack = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const easeIn = x => Math.pow(clamp(x), 3);
const easeInOut = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const fadeIO = (t, a, b, fi = .2, fo = .2) => smooth((t - a) / fi) * (1 - smooth((t - (b - fo)) / fo));
function rnd(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- ressources ---------- */
const IMG = {};
const load = src => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(src); i.src = src; });
const CLIPS = { coupe: 314, filasse: 104 }, cache = new Map();
async function frame(name, time) {
  const i = clamp(Math.round(time * FPS) + 1, 1, CLIPS[name]), key = name + i;
  if (!cache.has(key)) {
    cache.set(key, await load(`shots/${name}/f${String(i).padStart(4, "0")}.jpg`));
    if (cache.size > 12) cache.delete(cache.keys().next().value);
  }
  return cache.get(key);
}

/* ---------- dessin ---------- */
function cover(img, x, y, w, h, zoom = 1, fx = .5, fy = .5) {
  const s = Math.max(w / img.width, h / img.height) * zoom, dw = img.width * s, dh = img.height * s;
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  g.drawImage(img, x + (w - dw) * fx, y + (h - dh) * fy, dw, dh);
  g.restore();
}
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function font(size, f = "Anton", w = 400) { return `${w} ${size}px "${f}"`; }
function fit(s, size, maxW, f = "Anton", w = 400, ls = 0) {
  g.font = font(size, f, w); g.letterSpacing = ls + "px";
  const m = g.measureText(s).width; g.letterSpacing = "0px";
  return m > maxW ? size * maxW / m : size;
}
// texte : o = {f, w, c, al, a, ls, sh}
function txt(s, x, y, size, o = {}) {
  g.save();
  g.font = font(size, o.f || "Anton", o.w || 400);
  g.textAlign = o.al || "center"; g.textBaseline = "alphabetic"; g.letterSpacing = (o.ls || 0) + "px";
  g.globalAlpha *= o.a ?? 1;
  if (o.sh) { g.shadowColor = o.sh; g.shadowBlur = size * .35; g.shadowOffsetY = size * .05; }
  g.fillStyle = o.c || C.white;
  g.fillText(s, x, y);
  g.restore();
}
// texte qui claque : grossit puis se pose, avec un léger flou de mouvement
function slam(s, x, y, size, t, t0, o = {}) {
  if (t < t0) return;
  const p = (t - t0) / .32, k = 1 + .45 * (1 - easeOutExpo(p)), a = clamp((t - t0) / .06);
  const ax = o.al === "left" ? x : x, ay = y - size * .35;
  g.save(); g.translate(ax, ay); g.scale(k, k); g.translate(-ax, -ay);
  txt(s, x, y, size, { ...o, a: a * (o.a ?? 1) });
  g.restore();
}
// texte qui monte derrière un cache
function rise(s, x, y, size, t, t0, o = {}) {
  if (t < t0) return;
  const p = easeOutExpo((t - t0) / .55);
  g.save(); g.beginPath(); g.rect(0, y - size * 1.15, W, size * 1.4); g.clip();
  txt(s, x, y + (1 - p) * size * 1.2, size, o);
  g.restore();
}

/* ---------- eau : fond profond, gouttes, ondes, éclaboussures ---------- */
function water(t, a = 1) {
  g.save(); g.globalAlpha = a;
  g.fillStyle = C.ink; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = "lighter";
  for (let i = 0; i < 5; i++) {
    const x = W * (.5 + .42 * Math.sin(t * .35 + i * 1.7)), y = H * (.5 + .38 * Math.cos(t * .27 + i * 2.3)), r = Math.max(W, H) * (.38 + .1 * i % .3);
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, `rgba(30,95,180,${.22 - i * .025})`); gr.addColorStop(1, "rgba(30,95,180,0)");
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  }
  g.globalCompositeOperation = "source-over";
  bubbles(t, 0, 0, W, H, 34, 11);
  g.restore();
}
// bulles qui montent dans un rectangle, positions déterministes
function bubbles(t, x, y, w, h, n, seed, speed = 1) {
  const R = rnd(seed), s = Math.min(W, H) / 1080;
  for (let i = 0; i < n; i++) {
    const bx = x + R() * w, v = (.08 + R() * .16) * speed, r = (3 + R() * 9) * s, ph = R();
    const by = y + h - ((t * v + ph) % 1) * (h + 40), wob = Math.sin(t * 3 + i) * 6 * s;
    g.strokeStyle = "rgba(190,230,255,.35)"; g.lineWidth = 1.5 * s;
    g.beginPath(); g.arc(bx + wob, by, r, 0, Math.PI * 2); g.stroke();
    g.fillStyle = "rgba(255,255,255,.45)"; g.beginPath(); g.arc(bx + wob - r * .35, by - r * .35, r * .25, 0, Math.PI * 2); g.fill();
  }
}
function drop(x, y, r, a = 1) {
  g.save(); g.globalAlpha = a; g.translate(x, y);
  g.beginPath(); g.moveTo(0, -r * 2.1);
  g.bezierCurveTo(r * .35, -r * 1.2, r, -r * .55, r, 0); g.arc(0, 0, r, 0, Math.PI); g.bezierCurveTo(-r, -r * .55, -r * .35, -r * 1.2, 0, -r * 2.1);
  const gr = g.createLinearGradient(-r, -r * 2, r, r); gr.addColorStop(0, C.sky); gr.addColorStop(1, C.blue);
  g.fillStyle = gr; g.shadowColor = "rgba(47,143,230,.6)"; g.shadowBlur = r * .8; g.fill();
  g.shadowBlur = 0; g.fillStyle = "rgba(255,255,255,.75)";
  g.beginPath(); g.ellipse(-r * .38, -r * .2, r * .16, r * .32, -.35, 0, Math.PI * 2); g.fill();
  g.restore();
}
function ripples(x, y, t, t0, col = "47,143,230", n = 3, maxR = Math.max(W, H) * .55) {
  const age = t - t0; if (age < 0) return;
  g.save();
  for (let i = 0; i < n; i++) {
    const a = age - i * .16; if (a < 0) continue;
    const p = easeOut(a / 1.6), r = maxR * p;
    g.strokeStyle = `rgba(${col},${(1 - p) * .55})`; g.lineWidth = 2 + 10 * (1 - p);
    g.beginPath(); g.ellipse(x, y, r, r * (V ? 1 : .9), 0, 0, Math.PI * 2); g.stroke();
  }
  g.restore();
}
function splash(x, y, t, t0, seed, n = 46, power = 1) {
  const age = t - t0; if (age < 0 || age > 1.4) return;
  const R = rnd(seed), s = Math.min(W, H) / 1080;
  for (let i = 0; i < n; i++) {
    const ang = -Math.PI / 2 + (R() - .5) * Math.PI * 1.5, v = (500 + R() * 1300) * s * power, r = (4 + R() * 11) * s;
    const px = x + Math.cos(ang) * v * age, py = y + Math.sin(ang) * v * age + .5 * 2600 * s * age * age;
    const a = (1 - age / 1.4) * (.6 + .4 * R());
    g.save(); g.globalAlpha = a; g.fillStyle = R() < .25 ? C.white : C.sky;
    g.beginPath(); g.ellipse(px, py, r, r * 1.25, 0, 0, Math.PI * 2); g.fill(); g.restore();
  }
}

/* ---------- effets « waouh » ---------- */
// lettres qui tombent une à une et rebondissent
function stagger(s, x, y, size, t, t0, o = {}) {
  if (t < t0) return;
  g.save(); g.font = font(size, o.f || "Anton", o.w || 400); g.letterSpacing = (o.ls || 0) + "px"; g.textAlign = "left";
  const total = g.measureText(s).width, chars = [...s];
  const x0 = o.al === "left" ? x : x - total / 2;
  chars.forEach((ch, i) => {
    const q = (t - t0 - i * (o.step ?? .035)) / .5; if (q <= 0) return;
    const e = easeOutBack(q), pre = g.measureText(chars.slice(0, i).join("")).width;
    g.save(); g.globalAlpha *= clamp(q * 4) * (o.a ?? 1);
    g.translate(x0 + pre + size * .2, y - (1 - e) * size * .9); g.rotate((1 - clamp(e)) * -.35);
    if (o.sh) { g.shadowColor = o.sh; g.shadowBlur = size * .3; g.shadowOffsetY = size * .05; }
    g.fillStyle = o.c || C.white; g.fillText(ch, -size * .2, 0);
    g.restore();
  });
  g.restore();
}
// tuyau de cuivre qui se pose autour d'un bloc, puis l'eau y circule
function pipe(x, y, w, h, r, p, t) {
  if (p <= 0) return;
  const k = Math.min(W, H) / 1080, L = 2 * (w + h) - 8 * r + 2 * Math.PI * r;
  g.save(); g.lineCap = "round"; g.lineJoin = "round";
  [[30, "#4a200c", 0], [22, "#a8562a", 0], [12, "#d9874f", -2], [4, "#ffd9b3", -5]].forEach(([lw, c, off]) => {
    g.setLineDash([L * p, L * 2]); g.lineWidth = lw * k; g.strokeStyle = c;
    g.beginPath(); g.roundRect(x + off * k, y + off * k, w, h, r); g.stroke();
  });
  // manchons de raccord au milieu de chaque côté
  const side = [w - 2 * r, h - 2 * r], arc = Math.PI * r / 2;
  const marks = [[side[0] / 2, x + w / 2, y, 0], [side[0] + arc + side[1] / 2, x + w, y + h / 2, 1],
    [side[0] * 1.5 + 2 * arc + side[1], x + w / 2, y + h, 0], [side[0] * 2 + 3 * arc + side[1] * 1.5, x, y + h / 2, 1]];
  marks.forEach(([d, mx, my, vert]) => {
    if (L * p < d) return;
    const q = easeOutBack((L * p - d) / (L * .05));
    g.save(); g.translate(mx, my); if (vert) g.rotate(Math.PI / 2); g.scale(q, q);
    const lg = g.createLinearGradient(0, -22 * k, 0, 22 * k); lg.addColorStop(0, "#ffd0a0"); lg.addColorStop(.5, "#b8622e"); lg.addColorStop(1, "#4a200c");
    g.fillStyle = lg; g.beginPath(); g.roundRect(-24 * k, -22 * k, 48 * k, 44 * k, 6 * k); g.fill();
    g.restore();
  });
  if (p >= 1) {                                          // impulsion d'eau dans le tuyau
    g.setLineDash([L * .07, L]); g.lineDashOffset = -L * ((t * .55) % 1);
    g.lineWidth = 7 * k; g.strokeStyle = "rgba(170,225,255,.95)"; g.shadowColor = C.sky; g.shadowBlur = 22;
    g.beginPath(); g.roundRect(x - 2 * k, y - 2 * k, w, h, r); g.stroke();
  }
  g.restore();
}
// reflet qui balaie une image (logo)
function shine(img, x, y, w, h, p) {
  if (p <= 0 || p >= 1) return;
  sg.setTransform(1, 0, 0, 1, 0, 0); sg.globalCompositeOperation = "source-over"; sg.clearRect(0, 0, W, H);
  sg.setTransform(g.getTransform()); sg.drawImage(img, x, y, w, h);
  sg.globalCompositeOperation = "source-in";
  const bx = x - w * .3 + w * 1.6 * easeInOut(p), gr = sg.createLinearGradient(bx - w * .12, y, bx + w * .12, y + h * .25);
  gr.addColorStop(0, "rgba(255,255,255,0)"); gr.addColorStop(.5, "rgba(255,255,255,.9)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  sg.fillStyle = gr; sg.fillRect(x - w, y - h, w * 3, h * 3);
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(sc, 0, 0); g.restore();
}
// halos de lumière qui dérivent (look ciné)
function leaks(t, a = 1) {
  g.save(); g.globalCompositeOperation = "screen";
  [[242, 104, 58, .55, .2, 1.3], [47, 143, 230, .25, .75, 1.7]].forEach(([r, gg, b, px, py, sp], i) => {
    const x = W * (px + .25 * Math.sin(t * .5 * sp + i)), y = H * (py + .2 * Math.cos(t * .4 * sp + i * 2)), rad = Math.max(W, H) * .45;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, `rgba(${r},${gg},${b},${.22 * a})`); gr.addColorStop(1, `rgba(${r},${gg},${b},0)`);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
  });
  g.restore();
}
// aberration chromatique sur les impacts : le rouge se décale
function rgbSplit(t) {
  let d = 0;
  for (const [h, s] of REEL.hits) { const a = t - h; if (a >= 0 && a < .3) d = Math.max(d, { big: 28, mid: 12, small: 5 }[s] * Math.exp(-a * 12)); }
  d *= Math.min(W, H) / 1080; if (d < 1) return;
  rg.globalCompositeOperation = "copy"; rg.drawImage(cv, 0, 0);
  rg.globalCompositeOperation = "multiply"; rg.fillStyle = "#f00"; rg.fillRect(0, 0, W, H);
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalCompositeOperation = "multiply"; g.fillStyle = "#0ff"; g.fillRect(0, 0, W, H);
  g.globalCompositeOperation = "lighter"; g.drawImage(rc, d, d * .3);
  g.restore();
}
// chasse d'eau : une vague bleue monte, couvre l'écran sur la coupe, puis repart vers le haut
function flush(t) {
  for (const tc of REEL.wipes) {
    const u = (t - tc + .38) / .76; if (u <= 0 || u >= 1) continue;
    const A = Math.min(W, H) * .055;
    const wave = (x, ph) => A * (.6 * Math.sin(x / W * 7 + t * 9 + ph) + .4 * Math.sin(x / W * 15 - t * 7 + ph * 2));
    let top, bot;
    if (u < .5) { top = H + A * 2 - (H + A * 4) * easeInOut(u / .5); bot = H + A * 3; }
    else { top = -A * 3; bot = H + A * 2 - (H + A * 4) * easeInOut((u - .5) / .5); }
    g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
    g.beginPath(); g.moveTo(0, top + wave(0, 0));
    for (let x = 0; x <= W; x += 16) g.lineTo(x, top + wave(x, 0));
    for (let x = W; x >= 0; x -= 16) g.lineTo(x, bot + wave(x, 2));
    g.closePath();
    const gr = g.createLinearGradient(0, top, 0, bot); gr.addColorStop(0, "#7cc8ff"); gr.addColorStop(.18, C.blue); gr.addColorStop(1, "#06204a");
    g.fillStyle = gr; g.fill();
    g.save(); g.clip();
    g.globalCompositeOperation = "screen";                  // rayons de lumière
    for (let i = 0; i < 5; i++) {
      const rx = W * (.1 + i * .2) + Math.sin(t * 2 + i) * W * .05, lg = g.createLinearGradient(rx - 60, 0, rx + 60, 0);
      lg.addColorStop(0, "rgba(255,255,255,0)"); lg.addColorStop(.5, "rgba(200,235,255,.16)"); lg.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = lg; g.save(); g.translate(rx, 0); g.transform(1, 0, -.25, 1, 0, 0); g.translate(-rx, 0); g.fillRect(rx - 60, top, 120, bot - top); g.restore();
    }
    g.globalCompositeOperation = "source-over";
    bubbles(t * 2.2, 0, Math.max(top, -A), W, Math.min(bot, H) - Math.max(top, -A), 70, tc * 10, 2.5);
    g.restore();
    g.lineWidth = 7 * Math.min(W, H) / 1080; g.strokeStyle = "rgba(255,255,255,.9)";
    const edge = (yy, ph) => { g.beginPath(); for (let x = 0; x <= W; x += 16) x ? g.lineTo(x, yy + wave(x, ph)) : g.moveTo(x, yy + wave(x, ph)); g.stroke(); };
    if (top > -A * 2) edge(top, 0);
    if (bot < H + A) edge(bot, 2);
    g.restore();
  }
}

/* ---------- impacts : tremblement, flash ---------- */
function shake(t) {
  let x = 0, y = 0;
  for (const [h, s] of REEL.hits) {
    const a = t - h; if (a < 0 || a > .45) continue;
    const amp = { big: 22, mid: 7, small: 3 }[s] * Math.exp(-a * 9) * Math.min(W, H) / 1080;
    x += Math.sin(a * 83 + h) * amp; y += Math.cos(a * 71 + h * 2) * amp;
  }
  return [x, y];
}
function flash(t) {
  let f = 0;
  for (const [h, s] of REEL.hits) { const a = t - h; if (a >= 0 && a < .3) f = Math.max(f, { big: .85, mid: .22, small: .1 }[s] * Math.exp(-a * 14)); }
  return f;
}

/* ---------- mise en page : 16:9 (projection) ou 9:16 (réseaux) ---------- */
// photo ou extrait vidéo : plein cadre en 9:16 ; en 16:9, carte verticale à droite sur fond flouté
function media(img, t, t0, dur, o = {}) {
  const p = clamp((t - t0) / dur), punch = 1 + .07 * (1 - easeOutExpo((t - t0) / .4));
  const z = (o.z0 ?? 1.04) + ((o.z1 ?? 1.12) - (o.z0 ?? 1.04)) * p;
  const dim = o.dim ?? .2;
  const zb = 1 - clamp((t - t0) / .25);
  if (V || o.full) {
    cover(img, 0, 0, W, H, z * punch, o.fx ?? .5, o.fy ?? .5);
    for (let k = 1; zb > 0 && k <= 3; k++) { g.save(); g.globalAlpha = .22 * zb; cover(img, 0, 0, W, H, z * punch * (1 + .05 * k * zb), o.fx ?? .5, o.fy ?? .5); g.restore(); }
    const gr = g.createLinearGradient(0, H * (V ? .38 : .2), 0, H);
    gr.addColorStop(0, "rgba(8,17,32,0)"); gr.addColorStop(1, `rgba(8,17,32,${o.grad ?? .92})`);
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    if (!V) { const gl = g.createLinearGradient(0, 0, W * .65, 0); gl.addColorStop(0, "rgba(8,17,32,.85)"); gl.addColorStop(1, "rgba(8,17,32,0)"); g.fillStyle = gl; g.fillRect(0, 0, W, H); }
  } else {
    g.save(); g.filter = "blur(36px) brightness(.38) saturate(1.2)"; cover(img, -60, -60, W + 120, H + 120, 1.1); g.restore();
    const ch = H * .84, cw = ch * .75, cx = W * .7 - cw / 2, cy = (H - ch) / 2 + (1 - easeOutExpo((t - t0) / .45)) * 40;
    g.save(); g.translate(W * .7, H / 2); g.rotate((o.rot ?? 1.2) * Math.PI / 180); g.translate(-W * .7, -H / 2);
    g.shadowColor = "rgba(0,0,0,.6)"; g.shadowBlur = 60; g.shadowOffsetY = 25;
    rrect(cx, cy, cw, ch, 26); g.fillStyle = "#000"; g.fill(); g.shadowColor = "transparent";
    g.save(); rrect(cx, cy, cw, ch, 26); g.clip(); cover(img, cx, cy, cw, ch, z * punch, o.fx ?? .5, o.fy ?? .5); g.restore();
    rrect(cx, cy, cw, ch, 26); g.strokeStyle = "rgba(143,208,255,.35)"; g.lineWidth = 2; g.stroke();
    g.restore();
  }
  if (dim) { g.fillStyle = `rgba(8,17,32,${dim})`; g.fillRect(0, 0, W, H); }
  leaks(t, .8);
}
// bloc de légende : sur-titre, titre, sous-titre (centré en bas en 9:16, à gauche en 16:9)
function caption(t, c) {
  const x = V ? W / 2 : W * .075, al = V ? "center" : "left", maxW = V ? W * .88 : W * .46;
  const big = fit(c.big, c.size || (V ? 200 : 190), maxW, "Anton", 400, 2);
  const base = V ? (c.y ?? 1430) : H * .5 + big * .38;
  if (c.kick) {
    const ky = base - big - (V ? 34 : 30);
    if (c.num) {
      g.save(); g.font = font(V ? 40 : 36, "Open Sans", 800); g.letterSpacing = "6px";
      const kw = g.measureText(c.kick).width; g.restore();
      const gap = V ? 100 : 80, nx = V ? W / 2 - (kw + gap) / 2 : x;
      rise(c.num, nx, ky, V ? 40 : 36, t, c.kt ?? c.t, { f: "Open Sans", w: 800, c: C.orange, al: "left", ls: 2 });
