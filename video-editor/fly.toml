# Remplace la ligne app par le nom que tu as choisi avec `fly apps create`.
app = "REMPLACE-MOI"
primary_region = "cdg"

[build]

[env]
  NODE_ENV = "production"
  VIDEO_EDITOR_STORAGE_ROOT = "/data"

[mounts]
  source = "video_editor_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Toujours actif — le pipeline tourne en sous-processus (voir
  # apps/web/src/server/jobs.ts), sans connexion HTTP maintenue pendant le
  # montage. L'auto-stop de Fly se base sur l'activité HTTP : il pourrait
  # arrêter la machine EN PLEIN RENDU. Le désactiver coûte plus cher
  # (machine allumée en continu) mais évite un montage tué à moitié.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# Machine de rendu — CPU performance DÉDIÉ (pas de vCPU partagé), pour que
# Remotion rende un maximum de frames en parallèle (§ objectif rendu).
# 16 vCPU performance + 32 Go : la concurrence Remotion s'adapte au runtime
# au nombre réel de CPU (voir packages/render/src/remotion.ts →
# resolveRenderConcurrency), donc cette machine sera exploitée à fond sans
# rien coder en dur. auto_stop_machines reste false (un rendu ne doit
# jamais être tué à mi-parcours par l'arrêt automatique de Fly).
#
# Profils indicatifs (choisir selon le débit voulu / coût) :
#   DEV     : shared-cpu-2x  / 2gb   (lent, économique)
#   PROD    : performance-16x / 32gb (cible actuelle — rendu rapide)
#   Débit + : plusieurs machines performance-* (le scheduler + claim
#             atomique en base rendent l'ajout de machines sûr, voir FACTORY.md)
[[vm]]
  size = "performance-16x"
  memory = "32gb"
