# Remplace la ligne app par le nom que tu as choisi avec `fly apps create`.
app = "REMPLACE-MOI"
primary_region = "cdg"

[build]

[env]
  NODE_ENV = "production"
  VIDEO_EDITOR_STORAGE_ROOT = "/data"

[mounts]
  source = "video_editor_data"
  destination = "/data"
  # Volume créé automatiquement au 1er déploiement s'il n'existe pas.
  # 20 Go : fichiers en transit des imports cloud + cache des montages
  # (les originaux vivent dans R2). ≈ 3 $/mois. Agrandir : fly volumes extend.
  initial_size = "20gb"

[http_service]
  internal_port = 3000
  force_https = true
  # Toujours actif — le pipeline tourne en sous-processus (voir
  # apps/web/src/server/jobs.ts), sans connexion HTTP maintenue pendant le
  # montage. L'auto-stop de Fly se base sur l'activité HTTP : il pourrait
  # arrêter la machine EN PLEIN RENDU. Le désactiver coûte plus cher
  # (machine allumée en continu) mais évite un montage tué à moitié.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

# Machine de rendu. Depuis que l'habillage passe par FFmpeg (et plus par
# Remotion/Chromium), 4 vCPU suffisent : mesuré ~1 min 40 pour un Reel
# parlé de 21 s, transcription comprise (≈ 35 Reels/heure).
# Prix indicatifs Fly (région de référence, machine allumée 24/7, à
# vérifier sur fly.io/docs/pricing avant de lancer) :
#   shared-cpu-4x  / 8gb   ≈ 43 $/mois   ← défaut : démarrage
#   performance-4x / 8gb   ≈ 124 $/mois  (CPU dédié, débit régulier)
#   performance-16x / 32gb ≈ 500 $/mois  (inutile tant qu'il n'y a pas
#                                         des centaines de vidéos/jour)
# 8 Go de RAM : le modèle de transcription local occupe ~1,3 Go.
[[vm]]
  size = "shared-cpu-4x"
  memory = "8gb"
